name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The four action pins below were bumped on 2026-08-22. Run 32565519240
      # was green but warned that `actions/checkout@v4`, `actions/setup-node@v4`
      # and `pnpm/action-setup@v4` declare the deprecated `node20` runtime and
      # were being forced onto Node 24 by the runner — a warning that becomes a
      # failure when the runner stops carrying Node 20 at all.
      #
      # The majors were read from each repository's latest release rather than
      # guessed (`gh api repos/<owner>/<repo>/releases/latest`): checkout
      # v7.0.1, setup-node v7.0.0, upload-artifact v7.0.1, action-setup
      # v6.0.10. Each new major's action.yml was checked to declare `node24`
      # and to still accept the inputs used here (`node-version-file`, `cache`,
      # `version`, `retention-days`, `if-no-files-found`).
      #
      # Not yet verified on a runner: no CI run has executed these pins. The
      # first push after this commit is what proves them.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm format:check` existed since Task 1 and had never passed — it is
      # not one of the five gates and nothing ran it, so 11 files had drifted.
      # Task 14 reformatted them and gates it here: fixing the files without
      # gating them just lets the same drift happen again, and a formatter that
      # has never passed is a broken window rather than a control.
      #
      # First, because it is the cheapest signal in the job.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Immediately after the unit tests, and deliberately not later: this is
      # the check that says whether the step above actually ran anything. A
      # spec matching no Vitest project executes nothing while
      # `--passWithNoTests` prints green, and Task 12 hit three separate
      # spellings of that in one task — the third introduced by the fix round
      # for the second. Needs no build and no services.
      - name: Spec-project coverage
        run: pnpm check:specs

      # Credential-shaped literals in committed files. Not a secret scanner —
      # a shape rule, and it sits in the cheap lane because it needs no build,
      # no services and about a second. Three of this repository's four code
      # pull requests failed a third-party secret scanner on test fixtures that
      # looked like credentials and were not; this catches that class before a
      # push instead of after one. scripts/check-secret-shaped-literals.ts
      # carries the full account, including why a .gitguardian.yaml ignore list
      # would not have worked.
      - name: Credential-shaped literals
        run: pnpm check:secrets

      # The integration suites are the only gate that proves the tenant-isolation
      # layer, the storage adapter and the API pipeline actually work against
      # real services rather than mocks — so CI has to stand the same stack up
      # that a developer runs. `.env.example` holds local-safe placeholders and
      # is the same file the setup docs tell a developer to copy; using it here
      # means drift between the two is caught by a red build rather than by the
      # next person to clone the repo.
      #
      # `minio-init` is a one-shot that creates the buckets and exits, so it is
      # excluded from `--wait` (which waits for services to stay up) and run to
      # completion separately.
      - name: Start the local stack
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis minio mailpit
          docker compose run --rm minio-init

      # ITS OWN NAMED STEP, ON PURPOSE, AND IT RUNS TWICE.
      #
      # The plan's Task 18: "CI runs the authorization matrix test as its own
      # named step so a failure reads as 'authorization matrix failed' rather
      # than as a generic test failure." That matters more here than the seconds
      # it costs. This one spec asserts that every route in the API denies the
      # principal it should deny — it is the executable form of
      # security/authorization.md — and a red X labelled "Integration tests" on
      # a 29-route API tells a reviewer to go looking, while a red X labelled
      # "Authorization matrix" tells them what broke and how much it matters.
      #
      # It is not excluded from the run below. Excluding it would make the two
      # steps able to disagree about which spec is the matrix, and a filter that
      # silently matches nothing is the failure mode that turns a security gate
      # into a no-op. Running it twice cannot do that.
      - name: Authorization matrix
        run: pnpm test:authz-matrix

      - name: Integration tests
        run: pnpm test:integration

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Build
        run: pnpm build

      # Both of these run after the build because they read built output:
      # `check:registry` imports `@sentinel/db`, which resolves to
      # `packages/db/dist`, and `check:openapi` compiles `apps/api` and boots
      # its Nest container. Neither needs Postgres, Redis or MinIO — the stack
      # is already up by this point, but that is incidental, not a dependency.
      - name: OpenAPI contract diff
        run: pnpm check:openapi

      - name: Tenant resource registry completeness
        run: pnpm check:registry

      # The end-to-end stage. Until it existed, nothing in CI rendered a page:
      # the Playwright suite is the only thing asserting that the CSP nonce
      # reaches the HTML, that the enforcing policy does not break the page, and
      # that the transport-and-headers.md §2 header table survives on a real
      # response — and it ran on exactly one developer's Windows machine, so any
      # of those could regress with CI green.
      #
      # Only chromium, and only its system dependencies: installing all three
      # browser families costs minutes per run to assert nothing this suite
      # asserts (playwright.config.ts declares a single `chromium` project).
      - name: Install Playwright chromium
        run: pnpm --filter @sentinel/web exec playwright install --with-deps chromium

      # `playwright.config.ts` owns the servers — plural since Task 18. It starts
      # BOTH the web app and an API of its own, because the phase's exit
      # criterion is an authenticated journey and there is no such thing against
      # a web server alone. The API is booted with `WEB_BASE_URL` pointing at
      # `E2E_PORT`: that value is read once at boot as the single CORS origin
      # and as the base of every emailed link, so an API that thinks the browser
      # is on `WEB_PORT` refuses the suite at the CORS pass and mails links into
      # a server nobody started.
      #
      # Both read `E2E_PORT`, `E2E_API_PORT` and `E2E_MAILPIT_URL` from the
      # `.env` copied out of `.env.example` in the stack step above, so that file
      # has to exist before this runs — which is why the E2E stage sits after it
      # and not next to the unit tests. The suite also READS MAIL from the
      # Mailpit container started there, so this stage genuinely depends on the
      # stack rather than merely following it.
      #
      # `start:e2e` pins `APP_ENV=test` on both halves, which is what makes the
      # CSP enforcing rather than report-only.
      #
      # The ports are deliberately not `WEB_PORT`/`API_PORT`, and
      # `reuseExistingServer` is `false` everywhere — locally too, since the
      # measurement in `playwright.config.ts` showed reuse never saved the
      # rebuild it was supposed to save. So neither a developer's stray
      # `pnpm dev` nor a leftover `start:e2e` can be what the suite tests.
      - name: End-to-end tests
        run: pnpm test:e2e

      # A failing E2E stage with no artefact is a stage people disable. The
      # trace is written on first retry (`trace: 'on-first-retry'`), and CI runs
      # with `retries: 2`, so a genuine failure always leaves one behind.
      # The E2E API's own log. Playwright stops relaying a webServer's output
      # once its readiness URL answers, so a server that boots cleanly and then
      # answers 500 leaves nothing in the job output — four consecutive runs
      # failed at POST /auth/register with no server-side reason anywhere.
      # `apps/api/scripts/start-e2e.ts` tees to this file for exactly this step.
      - name: E2E API log on failure
        if: failure()
        run: cat apps/api/e2e-api.log || echo "no e2e-api.log written"

      - name: Upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
