services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_local
      POSTGRES_DB: sentinel
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready defaults to
      # the unix socket, which the entrypoint's *temporary* init server also
      # listens on — so the check reports healthy for several seconds before
      # 01-app-role.sql has run and sentinel_app exists. TCP is refused until
      # the real server is up, after init completes.
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinel_local
      MINIO_ROOT_PASSWORD: sentinel_local_secret
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sentinel_local sentinel_local_secret &&
      for b in evidence reports uploads exports; do
        mc mb --ignore-existing local/$$b &&
        mc anonymous set none local/$$b;
      done
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  # Deliberately vulnerable target for engine tests. Local only, and safe to
  # scan because we own it. Started with: docker compose --profile testing up -d
  # Bound to loopback only — this is a real, unpatched vulnerable app; on any
  # interface other than localhost it is reachable by the whole LAN.
  vulnerable-target:
    image: bkimminich/juice-shop:latest
    profiles: [testing]
    restart: unless-stopped
    ports: ['127.0.0.1:8080:3000']

volumes:
  postgres-data:
  redis-data:
  minio-data:
